name: conformly

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conformly
      POSTGRES_USER: conformly
      POSTGRES_PASSWORD: conformly
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conformly -d conformly"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CONFORMLY_STORAGE_ACCESS_KEY:-conformly_minio}
      MINIO_ROOT_PASSWORD: ${CONFORMLY_STORAGE_SECRET_KEY:-conformly_minio_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${CONFORMLY_STORAGE_ACCESS_KEY:-conformly_minio} $${CONFORMLY_STORAGE_SECRET_KEY:-conformly_minio_secret};
      mc mb local/$${CONFORMLY_STORAGE_BUCKET:-conformly-files} --ignore-existing;
      exit 0;
      "

  migrate:
    build: ./apps/api
    environment:
      CONFORMLY_DATABASE_URL: postgresql+psycopg://conformly:conformly@postgres:5432/conformly
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./apps/api
    environment:
      CONFORMLY_DATABASE_URL: postgresql+psycopg://conformly_app:conformly_app@postgres:5432/conformly
      CONFORMLY_OIDC_ISSUER: ${CONFORMLY_OIDC_ISSUER:-}
      CONFORMLY_OIDC_AUDIENCE: ${CONFORMLY_OIDC_AUDIENCE:-}
      CONFORMLY_OIDC_JWKS_URL: ${CONFORMLY_OIDC_JWKS_URL:-}
      CONFORMLY_CORS_ORIGINS: ${CONFORMLY_CORS_ORIGINS:-["http://localhost:3000","http://192.168.0.5:3000"]}
      CONFORMLY_LOCAL_KEKS: ${CONFORMLY_LOCAL_KEKS:-{}}
      CONFORMLY_ACTIVE_KEK_VERSION: ${CONFORMLY_ACTIVE_KEK_VERSION:-}
      CONFORMLY_INVITATION_TOKEN_PEPPER: ${CONFORMLY_INVITATION_TOKEN_PEPPER:-}
      CONFORMLY_STORAGE_BACKEND: ${CONFORMLY_STORAGE_BACKEND:-s3}
      CONFORMLY_STORAGE_ENDPOINT: ${CONFORMLY_STORAGE_ENDPOINT:-http://minio:9000}
      CONFORMLY_STORAGE_BUCKET: ${CONFORMLY_STORAGE_BUCKET:-conformly-files}
      CONFORMLY_STORAGE_ACCESS_KEY: ${CONFORMLY_STORAGE_ACCESS_KEY:-conformly_minio}
      CONFORMLY_STORAGE_SECRET_KEY: ${CONFORMLY_STORAGE_SECRET_KEY:-conformly_minio_secret}
      CONFORMLY_STORAGE_REGION: ${CONFORMLY_STORAGE_REGION:-us-east-1}
    ports:
      - "${CONFORMLY_API_HOST_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://192.168.0.5:8001}
        VITE_OIDC_AUTHORIZATION_URL: ${VITE_OIDC_AUTHORIZATION_URL:-}
        VITE_OIDC_TOKEN_URL: ${VITE_OIDC_TOKEN_URL:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://192.168.0.5:3000/}
        VITE_OIDC_SCOPES: ${VITE_OIDC_SCOPES:-openid profile email}
    ports:
      - "${CONFORMLY_WEB_HOST_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
