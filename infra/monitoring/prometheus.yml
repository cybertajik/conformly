global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "conformly-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "keycloak"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["keycloak:8080"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
